name: Build frpc for iOS (no web)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build frpc (no web UI)
        run: |
          go build -tags=noserver -o frpc ./cmd/frpc
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build -tags=noserver -trimpath -ldflags="-s -w" -o frpc ./cmd/frpc

      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios-arm64
          path: frpc
