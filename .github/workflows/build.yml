name: Build frpc for iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List all files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Root directory contents ==="
          ls -la
          echo "=== Check cmd directory ==="
          ls -la cmd || echo "cmd directory not found"
          echo "=== Check cmd/frpc directory ==="
          ls -la cmd/frpc || echo "cmd/frpc directory not found"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build frpc for iOS arm64
        run: |
          GOOS=ios GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o frpc ./cmd/frpc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpc-ios-arm64
          path: frpc
