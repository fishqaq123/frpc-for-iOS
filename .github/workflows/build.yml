name: Build frpc for iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - List directory structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== cmd/frpc directory (if exists) ==="
          ls -la cmd/frpc || echo "cmd/frpc not found"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build frpc for iOS arm64
        run: |
          cd cmd/frpc
          GOOS=ios GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o frpc
          cd ../../
          mv cmd/frpc/frpc .
